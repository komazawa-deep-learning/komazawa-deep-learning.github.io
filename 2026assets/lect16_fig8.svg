<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>意味プライミングの逐次呈示手続きを示す模式図</title>
<desc>プライム語の提示、SOA、ターゲット語の提示、語彙判断からなる4段階の手続きと、関連プライム条件・無関連プライム条件それぞれの反応時間の相対的な違いを示す概念図</desc>
<defs>
<marker id="arrow16" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="107" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">プライム語提示</text>
<text x="107" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">例: 医者</text>

<line x1="175" y1="68" x2="195" y2="68" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow16)"/>

<rect x="195" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="262" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">SOA</text>
<text x="262" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">時間間隔</text>

<line x1="330" y1="68" x2="350" y2="68" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow16)"/>

<rect x="350" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="417" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">ターゲット提示</text>
<text x="417" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">例: 看護師</text>

<line x1="485" y1="68" x2="505" y2="68" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow16)"/>

<rect x="505" y="40" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="572" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">語彙判断</text>
<text x="572" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">反応時間測定</text>

<rect x="40" y="140" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">関連プライム条件</text>
<text x="120" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">医者 → 看護師</text>
<rect x="220" y="152" width="150" height="20" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<text x="380" y="162" dominant-baseline="central" font-size="12" fill="#5F5E5A">速い</text>

<rect x="40" y="210" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">無関連プライム</text>
<text x="120" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">机 → 看護師</text>
<rect x="220" y="222" width="260" height="20" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="232" dominant-baseline="central" font-size="12" fill="#5F5E5A">遅い</text>
</svg>
