<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>one-hot表現と分散表現の比較図</title>
<desc>左側はone-hot表現で、猫・犬・机の各単語が5次元の疎なベクトルとして表され、どの2語間の類似度も0になることを示す。右側は分散表現で、同じ3語が2次元の意味空間上の点として表され、猫と犬は近く、机は遠い位置に配置されることで意味的な近さが距離として表現されることを示す。</desc>

<rect x="40" y="40" width="290" height="250" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="64" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">one-hot表現</text>

<text x="64" y="106" font-size="14" fill="#2C2C2A" dominant-baseline="central">猫</text>
<rect x="110" y="94" width="24" height="24" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/><text x="122" y="106" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="140" y="94" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="152" y="106" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="170" y="94" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="182" y="106" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="200" y="94" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="212" y="106" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="230" y="94" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="242" y="106" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>

<text x="64" y="156" font-size="14" fill="#2C2C2A" dominant-baseline="central">犬</text>
<rect x="110" y="144" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="122" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="140" y="144" width="24" height="24" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/><text x="152" y="156" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="170" y="144" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="182" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="200" y="144" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="212" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="230" y="144" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="242" y="156" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>

<text x="64" y="206" font-size="14" fill="#2C2C2A" dominant-baseline="central">机</text>
<rect x="110" y="194" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="122" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="140" y="194" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="152" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="170" y="194" width="24" height="24" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/><text x="182" y="206" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="200" y="194" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="212" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="230" y="194" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="242" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0</text>

<text x="56" y="250" font-size="12" fill="#5F5E5A" dominant-baseline="central">任意の2語間の類似度は常に0</text>

<rect x="350" y="40" width="290" height="250" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="366" y="64" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">分散表現</text>

<line x1="420" y1="150" x2="460" y2="170" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="420" y1="150" x2="580" y2="240" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<circle cx="420" cy="150" r="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
<circle cx="460" cy="170" r="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
<circle cx="580" cy="240" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="0.5"/>

<text x="420" y="134" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">猫</text>
<text x="476" y="178" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">犬</text>
<text x="592" y="244" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">机</text>

<text x="438" y="146" font-size="12" fill="#5F5E5A" text-anchor="middle">近い</text>
<text x="500" y="182" font-size="12" fill="#5F5E5A" text-anchor="middle">遠い</text>

<text x="366" y="250" font-size="12" fill="#0F6E56" dominant-baseline="central">距離が意味的な類似度を反映する</text>
</svg>
