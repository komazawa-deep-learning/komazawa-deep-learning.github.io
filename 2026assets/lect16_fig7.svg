<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>入力・処理・出力の枠組みを示す図</title>
<desc>認知課題やNLPタスクを入力、処理、出力の3段階でモデル化する一般的な枠組みを示す図</desc>
<defs>
<marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="130" y="60" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">入力</text>
<text x="130" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例: 文章、単語列</text>

<line x1="220" y1="68" x2="250" y2="68" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow7)"/>

<rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="60" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">処理</text>
<text x="340" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例: ニューラルネットワーク</text>

<line x1="430" y1="68" x2="460" y2="68" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow7)"/>

<rect x="460" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="550" y="60" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">出力</text>
<text x="550" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例: ラベル、文、要約</text>
</svg>
